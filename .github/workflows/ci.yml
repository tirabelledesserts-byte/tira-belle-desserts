name: TIRA Belle Production CI & Security Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Business Logic & Security Unit Tests
      run: |
        python -m unittest tests/test_backend.py -v

    - name: Verify No Secrets or Private Keys in Repository
      run: |
        echo "Scanning for accidental secrets..."
        ! grep -riE "BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY" . --exclude-dir=".git"
        ! grep -riE "adminPassword:\s*['\"][^'\"]+['\"]" js/ --exclude="*.test.js"

    - name: Verify HTML & Assets Integrity
      run: |
        test -f index.html
        test -f tira-desk.html
        test -f tracker.html
        test -f robots.txt
        test -f sitemap.xml
        test -f manifest.json
        echo "All core assets and SEO documents verified."
